name: Build installer.exe

on:
  push:
    paths:
      - 'installer/installer.py'
      - 'installer/build.bat'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default checkout uses a token without push rights once the
          # workflow needs to push back; this token has contents: write.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file exe
        working-directory: installer
        run: |
          python -m PyInstaller `
            --onefile `
            --noconsole `
            --name installer `
            --distpath dist `
            --workpath build `
            --specpath build `
            installer.py

      - name: Commit _Core/installer.exe back to repo
        run: |
          if (-not (Test-Path _Core)) { New-Item -ItemType Directory _Core | Out-Null }
          Copy-Item -Force installer/dist/installer.exe _Core/installer.exe
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _Core/installer.exe
          if (git diff --cached --quiet) {
            Write-Host "installer.exe unchanged — nothing to commit."
          } else {
            git commit -m "ci: rebuild _Core/installer.exe"
            git push
          }
